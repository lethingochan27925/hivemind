name: Security

# Supply-chain and infrastructure scanning, independent of the deploy chain.
#
# Two different postures on purpose:
#   - govulncheck and gitleaks are HARD gates. A reachable CVE or a committed
#     secret is never acceptable in a public repository.
#   - the IaC scan reports everything to the Security tab but only fails the
#     build on CRITICAL, so a MEDIUM style finding cannot block a deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  TRIVY_VERSION: '0.58.1'

jobs:
  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      # Pinned: an unpinned @latest turns "a new CVE was published" into "the
      # build broke overnight for a reason nobody changed".
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan
        run: govulncheck ./...

  iac-scan:
    name: Terraform static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Trivy runs from its pinned official image: no third-party action, no
      # surprise upgrade. (It replaced tfsec, which is archived and panics on
      # this configuration.)
      - name: Scan Terraform (report everything)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "aquasec/trivy:${TRIVY_VERSION}" \
            config terraform --format sarif --output trivy.sarif --exit-code 0

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-iac

      - name: Fail on CRITICAL findings
        run: |
          docker run --rm -v "$PWD:/src" -w /src "aquasec/trivy:${TRIVY_VERSION}" \
            config terraform --severity CRITICAL --exit-code 1

  image-scan:
    name: Container image CVE scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      # Same service -> cmd_path mapping as ci.yml's docker job and
      # build-and-push.yml; pipeline_test.sh asserts all three stay identical.
      matrix:
        include:
          - service: agent-worker
            cmd_path: ./cmd/worker
          - service: dispatcher
            cmd_path: ./cmd/dispatcher
          - service: reaper
            cmd_path: ./cmd/heartbeat-reaper
          - service: salience-decay
            cmd_path: ./cmd/salience-decay
          - service: scoring-api
            cmd_path: ./cmd/scoring-api
          - service: dashboard-api
            cmd_path: ./cmd/dashboard-api
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }}
        run: |
          docker build --provenance=false --sbom=false -f Dockerfile.lambda-go \
            --build-arg SERVICE_PATH=${{ matrix.cmd_path }} \
            -t "hivemind-${{ matrix.service }}:scan" .

      # Report everything to the Security tab (exit-code 0), same posture as
      # iac-scan above: MEDIUM/LOW findings are visible but do not block a
      # push. Base-image and OS-package CVEs are the class of finding this
      # catches that govulncheck (Go module CVEs only) cannot - previously
      # nothing in CI looked at what actually shipped inside the image.
      - name: Scan image (report everything)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" -w /src \
            "aquasec/trivy:${TRIVY_VERSION}" image --format sarif \
            --output "trivy-${{ matrix.service }}.sarif" "hivemind-${{ matrix.service }}:scan"

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

      - name: Fail on CRITICAL findings
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" -w /src \
            "aquasec/trivy:${TRIVY_VERSION}" image --severity CRITICAL --exit-code 1 \
            "hivemind-${{ matrix.service }}:scan"

  image-scan-python:
    name: Container image CVE scan (scoring-python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build scoring-python
        run: |
          docker build --provenance=false --sbom=false -f services/scoring-python/Dockerfile \
            -t hivemind-scoring-python:scan .

      - name: Scan image (report everything)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" -w /src \
            "aquasec/trivy:${TRIVY_VERSION}" image --format sarif \
            --output trivy-scoring-python.sarif hivemind-scoring-python:scan

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-scoring-python.sarif
          category: trivy-image-scoring-python

      - name: Fail on CRITICAL findings
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" -w /src \
            "aquasec/trivy:${TRIVY_VERSION}" image --severity CRITICAL --exit-code 1 \
            hivemind-scoring-python:scan

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # whole history: a secret removed in a later commit still leaked

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Belt and braces around gitleaks: these are the specific mistakes this
      # repository is most exposed to, and they are cheap to assert directly.
      - name: No credential files tracked by git
        run: |
          BAD=$(git ls-files | grep -E '(^|/)\.env(\..*)?$|\.tfvars$|\.tfstate$|\.pem$|\.p12$|id_rsa' | grep -v '\.env\.example$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::credential-bearing files are tracked:"; echo "$BAD"; exit 1
          fi
          echo "no credential files tracked"

      - name: .gitignore covers the credential patterns
        run: |
          missing=0
          for pat in '.env' '*.tfvars' '*.tfstate' '*.log'; do
            grep -qF -- "$pat" .gitignore || { echo "::error::.gitignore is missing $pat"; missing=1; }
          done
          exit $missing

      - name: No AWS access keys anywhere in the tree
        run: |
          if grep -rInE 'AKIA[0-9A-Z]{16}|aws_secret_access_key[[:space:]]*=[[:space:]]*["'"'"'][A-Za-z0-9/+=]{40}' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=data . ; then
            echo "::error::an AWS key literal is present in the tree"; exit 1
          fi
          echo "no AWS key literals"

      - name: Workflows never echo a secret
        run: |
          if grep -rInE 'echo[^|]*\$\{\{[[:space:]]*secrets\.' .github/workflows; then
            echo "::error::a workflow echoes a secret"; exit 1
          fi
          echo "no workflow prints a secret"
