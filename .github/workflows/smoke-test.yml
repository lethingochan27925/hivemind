name: Smoke Test

# Third link of the delivery chain. Hits the live control plane and asserts it is
# healthy and that the read-only SQL guard still rejects mutating statements.
#
# Deploy Canary triggers on THIS workflow, not on Deploy Staging. That ordering
# is the whole point: previously both fired on Deploy Staging and ran in
# parallel, so traffic could shift before the smoke test had said anything.

on:
  workflow_run:
    workflows: ["Deploy Staging"]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: '1.14.8'

permissions:
  id-token: write
  contents: read

concurrency:
  group: smoke-test
  cancel-in-progress: false

jobs:
  smoke:
    name: Control-plane smoke test
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Resolve the dashboard-api URL
        id: tf
        working-directory: terraform
        run: |
          terraform init -input=false
          echo "api_url=$(terraform output -raw dashboard_api_url)" >> "$GITHUB_OUTPUT"

      # A Lambda that panics at init answers 502 to everything, including
      # /health — so this catches a broken control plane before any traffic
      # shifts to it.
      - name: Run smoke suite
        run: bash test/integration/api_smoke.sh "${{ steps.tf.outputs.api_url }}"
