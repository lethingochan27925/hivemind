name: Build and Push Images

# First link of the delivery chain. Every service is built once and pushed under
# the commit SHA; Terraform then deploys that exact tag. `latest` is published
# too, but only as a convenience for manual pulls — nothing deploys from it.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-southeast-1

permissions:
  id-token: write
  contents: read

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Kept identical to the docker matrix in ci.yml; pipeline_test.sh asserts
      # they do not drift apart.
      matrix:
        include:
          - service: agent-worker
            cmd_path: ./cmd/worker
          - service: dispatcher
            cmd_path: ./cmd/dispatcher
          - service: reaper
            cmd_path: ./cmd/heartbeat-reaper
          - service: salience-decay
            cmd_path: ./cmd/salience-decay
          - service: scoring-api
            cmd_path: ./cmd/scoring-api
          - service: dashboard-api
            cmd_path: ./cmd/dashboard-api

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # --provenance=false --sbom=false is mandatory. With buildx defaults the
      # push produces an OCI image index, and Lambda's update-function-code
      # rejects it with "image manifest, config or layer media type ... not
      # supported".
      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE: ${{ matrix.service }}
          CMD_PATH: ${{ matrix.cmd_path }}
        run: |
          REPO="${ECR_REGISTRY}/hivemind/dev/${SERVICE}"
          docker build --provenance=false --sbom=false -f Dockerfile.lambda-go \
            --build-arg SERVICE_PATH="${CMD_PATH}" \
            -t "${REPO}:${IMAGE_TAG}" \
            -t "${REPO}:latest" .
          docker push "${REPO}:${IMAGE_TAG}"
          docker push "${REPO}:latest"

  build-push-scoring-python:
    name: Build scoring-python
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          REPO="${ECR_REGISTRY}/hivemind/dev/scoring-python"
          docker build --provenance=false --sbom=false -f services/scoring-python/Dockerfile \
            -t "${REPO}:${IMAGE_TAG}" \
            -t "${REPO}:latest" .
          docker push "${REPO}:${IMAGE_TAG}"
          docker push "${REPO}:latest"
